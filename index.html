<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>VibeFrame — Liquid Glass Studio</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html-to-image CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

  <!-- Google Fonts: JetBrains Mono & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            oled: '#050505',
            surface: '#0d0d0f',
            glass: 'rgba(255, 255, 255, 0.05)',
            borderGlass: 'rgba(255, 255, 255, 0.12)',
          }
        }
      }
    };
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    body {
      background-color: #050505;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      overscroll-behavior: none;
    }

    /* Эффект Liquid Glass */
    .liquid-glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.4),
        0 24px 48px -12px rgba(0, 0, 0, 0.75);
    }

    .liquid-glass-dense {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.06) 0%, rgba(0, 0, 0, 0.4) 100%);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 
        inset 0 1px 0 0 rgba(255, 255, 255, 0.18),
        0 20px 40px -10px rgba(0, 0, 0, 0.9);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Пресеты фона */
    .bg-oled-grid {
      background-color: #030303;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
      background-size: 24px 24px, 100% 100%;
    }

    .bg-soft-gradient {
      background: radial-gradient(100% 100% at 50% 10%, #1f1f23 0%, #080809 100%);
    }

    .bg-subtle-mesh {
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.04) 0%, transparent 50%),
        #09090b;
    }

    .bg-pure-black {
      background: #000000;
    }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col justify-between overflow-hidden select-none bg-oled text-zinc-100">

  <!-- ВЕРХНИЙ ХЕДЕР -->
  <header class="w-full px-2.5 py-2.5 flex items-center justify-between border-b border-white/5 bg-oled/90 backdrop-blur-md z-30 gap-1">
    <!-- Логотип -->
    <div class="flex items-center gap-1.5 shrink-0">
      <div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>
      <span class="text-[11px] font-semibold tracking-wider uppercase text-zinc-300">VibeFrame</span>
    </div>

    <!-- Режим: Код / Мысль -->
    <div class="flex items-center bg-zinc-900/90 p-0.5 rounded-lg border border-white/10 text-[11px] shrink-0">
      <button id="mode-code" class="px-2 py-1 rounded-md text-white bg-white/10 font-medium transition-all flex items-center gap-1">
        <i data-lucide="code-2" class="w-3 h-3"></i>
        <span>Код</span>
      </button>
      <button id="mode-quote" class="px-2 py-1 rounded-md text-zinc-400 font-medium hover:text-white transition-all flex items-center gap-1">
        <i data-lucide="quote" class="w-3 h-3"></i>
        <span>Мысль</span>
      </button>
    </div>

    <!-- Действия: Копировать и Скачать -->
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btn-copy" class="w-8 h-8 flex items-center justify-center rounded-lg bg-zinc-900 border border-white/10 text-zinc-300 hover:text-white active:scale-95 transition-all" title="Скопировать PNG">
        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
      </button>
      <button id="btn-download" class="h-8 px-2.5 flex items-center justify-center gap-1 rounded-lg bg-white text-black font-semibold text-xs active:scale-95 transition-all shadow-md shrink-0" title="Скачать PNG">
        <i data-lucide="download" class="w-3.5 h-3.5 stroke-[2.5]"></i>
        <span class="text-[11px]">PNG</span>
      </button>
    </div>
  </header>

  <!-- ОСНОВНАЯ ЗОНА ПРЕВЬЮ -->
  <main class="flex-1 w-full flex items-center justify-center p-3 overflow-hidden relative">
    
    <!-- ЭКСПОРТИРУЕМЫЙ КОНТЕЙНЕР (ПРЯМЫЕ КРАЯ НА СКАЧИВАНИИ) -->
    <div id="capture-container" class="w-full max-w-[480px] bg-oled-grid transition-all duration-300 flex items-center justify-center overflow-hidden" style="padding: 24px; border-radius: 0px;">
      
      <!-- ЖИДКОЕ СТЕКЛО (КАРТОЧКА) -->
      <div id="glass-card" class="liquid-glass w-full rounded-2xl transition-all duration-200 overflow-hidden flex flex-col">
        
        <!-- Шапка карточки -->
        <div class="flex items-center justify-between px-3.5 py-2.5 border-b border-white/10 bg-white/[0.02]">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-white/30 border border-white/40"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-white/20 border border-white/30"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-white/15 border border-white/20"></span>
          </div>

          <input 
            type="text" 
            id="window-title" 
            value="snippet.py" 
            class="bg-transparent text-center text-[11px] font-mono text-zinc-400 focus:outline-none focus:text-white px-2 py-0.5 border border-transparent focus:border-white/10 rounded transition-all max-w-[140px]"
            spellcheck="false"
          />

          <div class="w-9 flex justify-end">
            <i data-lucide="sparkles" class="w-3 h-3 text-zinc-500"></i>
          </div>
        </div>

        <!-- Текстовый блок -->
        <div class="p-3.5 font-mono text-[13px] leading-relaxed relative flex">
          <!-- Нумерация строк -->
          <div id="line-numbers" class="select-none pr-3 text-zinc-600 text-right font-mono text-[12px] flex flex-col leading-relaxed border-r border-white/5 mr-3">
            <span>1</span>
            <span>2</span>
            <span>3</span>
          </div>

          <!-- Ввод контента -->
          <textarea 
            id="content-input" 
            rows="4" 
            class="w-full bg-transparent text-zinc-100 placeholder-zinc-600 resize-none focus:outline-none font-mono text-[13px] leading-relaxed no-scrollbar"
            placeholder="Введи код или текст..."
            spellcheck="false"
          >async def send_vibe(user_id):
    await bot.send_message(
        chat_id=user_id,
        text="liquid glass is clean"
    )</textarea>
        </div>

        <!-- Подвал карточки -->
        <div id="footer-row" class="px-3.5 py-2 border-t border-white/5 bg-black/20 flex items-center justify-between text-[11px] text-zinc-400 font-mono">
          <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-white"></span>
            <input 
              type="text" 
              id="author-input" 
              value="@myoec" 
              class="bg-transparent focus:outline-none focus:text-white text-zinc-300 w-28"
              spellcheck="false"
            />
          </div>
          <span class="text-zinc-600 text-[10px]">vibecode</span>
        </div>

      </div>
    </div>

  </main>

  <!-- НИЖНЯЯ ПАНЕЛЬ -->
  <footer class="w-full bg-oled/95 border-t border-white/10 backdrop-blur-xl z-30 pb-safe">
    
    <!-- Панель контента активного таба -->
    <div class="p-3 px-4 flex items-center justify-between gap-4 border-b border-white/5">
      
      <!-- Таб: Стекло -->
      <div id="tab-content-glass" class="tab-panel w-full flex items-center justify-between gap-2">
        <span class="text-xs text-zinc-400">Плотность:</span>
        <div class="grid grid-cols-2 gap-2 flex-1 max-w-[240px]">
          <button data-glass="light" class="glass-btn active py-1.5 px-3 rounded-lg border border-white text-white text-xs font-medium bg-white/10 transition-all text-center">Светлое</button>
          <button data-glass="dense" class="glass-btn py-1.5 px-3 rounded-lg border border-white/10 text-zinc-400 text-xs font-medium hover:text-white transition-all text-center">Глубокое</button>
        </div>
      </div>

      <!-- Таб: Фон -->
      <div id="tab-content-bg" class="tab-panel hidden w-full flex items-center justify-between gap-2">
        <span class="text-xs text-zinc-400">Текстура:</span>
        <div class="grid grid-cols-4 gap-1.5 flex-1 max-w-[250px]">
          <button data-bg="bg-oled-grid" class="bg-opt-btn active h-8 rounded border border-white bg-zinc-900 text-[10px] text-white">Сетка</button>
          <button data-bg="bg-soft-gradient" class="bg-opt-btn h-8 rounded border border-white/10 bg-zinc-800 text-[10px] text-zinc-400">Градиент</button>
          <button data-bg="bg-subtle-mesh" class="bg-opt-btn h-8 rounded border border-white/10 bg-zinc-700 text-[10px] text-zinc-400">Блик</button>
          <button data-bg="bg-pure-black" class="bg-opt-btn h-8 rounded border border-white/10 bg-black text-[10px] text-zinc-400">OLED</button>
        </div>
      </div>

      <!-- Таб: Отступы -->
      <div id="tab-content-padding" class="tab-panel hidden w-full flex items-center justify-between gap-3">
        <span class="text-xs text-zinc-400">Отступ:</span>
        <div class="flex items-center gap-2 flex-1 max-w-[200px]">
          <input type="range" id="pad-slider" min="12" max="44" value="24" class="w-full accent-white bg-zinc-800 rounded-lg cursor-pointer h-1.5" />
          <span id="pad-val" class="text-xs font-mono text-zinc-400 w-7">24</span>
        </div>
      </div>

      <!-- Таб: Автор -->
      <div id="tab-content-meta" class="tab-panel hidden w-full flex items-center justify-between gap-3">
        <span class="text-xs text-zinc-400">Бейдж автора:</span>
        <button id="toggle-footer" class="py-1 px-3 rounded-lg border border-white/10 text-xs bg-white/5 text-zinc-200 hover:text-white">Показывать</button>
      </div>

    </div>

    <!-- Навигационные кнопки внизу -->
    <div class="grid grid-cols-4 px-2 py-1.5 text-[11px]">
      <button data-tab="glass" class="nav-tab active py-1.5 flex flex-col items-center gap-1 text-white">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        <span>Стекло</span>
      </button>
      <button data-tab="bg" class="nav-tab py-1.5 flex flex-col items-center gap-1 text-zinc-500 hover:text-zinc-300">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
        <span>Фон</span>
      </button>
      <button data-tab="padding" class="nav-tab py-1.5 flex flex-col items-center gap-1 text-zinc-500 hover:text-zinc-300">
        <i data-lucide="maximize-2" class="w-4 h-4"></i>
        <span>Отступ</span>
      </button>
      <button data-tab="meta" class="nav-tab py-1.5 flex flex-col items-center gap-1 text-zinc-500 hover:text-zinc-300">
        <i data-lucide="user" class="w-4 h-4"></i>
        <span>Автор</span>
      </button>
    </div>

  </footer>

  <!-- ВСплывающее уведомление -->
  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-white text-black px-4 py-2 rounded-xl text-xs font-semibold shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-2 z-50 flex items-center gap-2">
    <i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>
    <span id="toast-text">Скопировано</span>
  </div>

  <script>
    lucide.createIcons();

    const captureContainer = document.getElementById('capture-container');
    const glassCard = document.getElementById('glass-card');
    const contentInput = document.getElementById('content-input');
    const lineNumbers = document.getElementById('line-numbers');
    const windowTitle = document.getElementById('window-title');
    const footerRow = document.getElementById('footer-row');

    function showToast(text) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      toastText.innerText = text;
      toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 1800);
    }

    function updateLines() {
      const lines = contentInput.value.split('\n').length;
      lineNumbers.innerHTML = Array.from({ length: lines }, (_, i) => `<span>${i + 1}</span>`).join('');
      contentInput.rows = Math.max(3, Math.min(lines, 14));
    }

    contentInput.addEventListener('input', updateLines);
    updateLines();

    // Режим Код / Мысль
    const btnModeCode = document.getElementById('mode-code');
    const btnModeQuote = document.getElementById('mode-quote');

    btnModeCode.addEventListener('click', () => {
      btnModeCode.classList.add('bg-white/10', 'text-white');
      btnModeCode.classList.remove('text-zinc-400');
      btnModeQuote.classList.remove('bg-white/10', 'text-white');
      btnModeQuote.classList.add('text-zinc-400');

      lineNumbers.classList.remove('hidden');
      windowTitle.value = 'snippet.py';
      contentInput.classList.add('font-mono', 'text-[13px]');
      contentInput.classList.remove('font-sans', 'text-[15px]', 'italic');
    });

    btnModeQuote.addEventListener('click', () => {
      btnModeQuote.classList.add('bg-white/10', 'text-white');
      btnModeQuote.classList.remove('text-zinc-400');
      btnModeCode.classList.remove('bg-white/10', 'text-white');
      btnModeCode.classList.add('text-zinc-400');

      lineNumbers.classList.add('hidden');
      windowTitle.value = 'thoughts.txt';
      contentInput.classList.remove('font-mono', 'text-[13px]');
      contentInput.classList.add('font-sans', 'text-[15px]', 'italic');
    });

    // Переключение табов внизу
    const navTabs = document.querySelectorAll('.nav-tab');
    const tabPanels = document.querySelectorAll('.tab-panel');

    navTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        navTabs.forEach(t => {
          t.classList.remove('text-white');
          t.classList.add('text-zinc-500');
        });
        tab.classList.add('text-white');
        tab.classList.remove('text-zinc-500');

        const target = tab.dataset.tab;
        tabPanels.forEach(panel => {
          if (panel.id === `tab-content-${target}`) {
            panel.classList.remove('hidden');
          } else {
            panel.classList.add('hidden');
          }
        });
      });
    });

    // Варианты стекла
    const glassBtns = document.querySelectorAll('.glass-btn');
    glassBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        glassBtns.forEach(b => {
          b.classList.remove('border-white', 'text-white', 'bg-white/10');
          b.classList.add('border-white/10', 'text-zinc-400');
        });
        btn.classList.add('border-white', 'text-white', 'bg-white/10');
        btn.classList.remove('border-white/10', 'text-zinc-400');

        if (btn.dataset.glass === 'dense') {
          glassCard.classList.remove('liquid-glass');
          glassCard.classList.add('liquid-glass-dense');
        } else {
          glassCard.classList.remove('liquid-glass-dense');
          glassCard.classList.add('liquid-glass');
        }
      });
    });

    // Варианты фона
    const bgBtns = document.querySelectorAll('.bg-opt-btn');
    const bgClasses = ['bg-oled-grid', 'bg-soft-gradient', 'bg-subtle-mesh', 'bg-pure-black'];

    bgBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        bgBtns.forEach(b => {
          b.classList.remove('border-white', 'text-white');
          b.classList.add('border-white/10', 'text-zinc-400');
        });
        btn.classList.add('border-white', 'text-white');
        btn.classList.remove('border-white/10', 'text-zinc-400');

        bgClasses.forEach(cls => captureContainer.classList.remove(cls));
        captureContainer.classList.add(btn.dataset.bg);
      });
    });

    // Ползунок отступа
    const padSlider = document.getElementById('pad-slider');
    const padVal = document.getElementById('pad-val');

    padSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      padVal.innerText = val;
      captureContainer.style.padding = `${val}px`;
    });

    // Видимость автора
    const toggleFooter = document.getElementById('toggle-footer');
    let footerVisible = true;
    toggleFooter.addEventListener('click', () => {
      footerVisible = !footerVisible;
      footerRow.style.display = footerVisible ? 'flex' : 'none';
      toggleFooter.innerText = footerVisible ? 'Показывать' : 'Скрыто';
    });

    // Скачивание PNG со строгими прямыми краями
    document.getElementById('btn-download').addEventListener('click', async () => {
      try {
        showToast('Рендер...');
        captureContainer.style.borderRadius = '0px';

        const dataUrl = await htmlToImage.toPng(captureContainer, {
          pixelRatio: 3,
          backgroundColor: '#000000',
          style: {
            borderRadius: '0px',
            margin: '0',
          }
        });

        const link = document.createElement('a');
        link.download = `vibe-frame-${Date.now()}.png`;
        link.href = dataUrl;
        link.click();

        showToast('PNG скачан!');
      } catch (err) {
        console.error(err);
        showToast('Ошибка скачивания');
      }
    });

    // Копирование в буфер
    document.getElementById('btn-copy').addEventListener('click', async () => {
      try {
        captureContainer.style.borderRadius = '0px';
        const blob = await htmlToImage.toBlob(captureContainer, {
          pixelRatio: 3,
          backgroundColor: '#000000',
        });

        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
          ]);
          showToast('Скопировано!');
        } else {
          showToast('Буфер не поддерживается');
        }
      } catch (err) {
        console.error(err);
        showToast('Ошибка буфера');
      }
    });
  </script>
</body>
</html>
